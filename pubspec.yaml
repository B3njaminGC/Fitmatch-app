name: fitmatch_app
description: FitMatch - probador virtual de talles con maniquí a tu medida.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#7F77DD"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
