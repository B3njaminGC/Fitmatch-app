name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar la carpeta android (sin tocar lib/ ni pubspec)
        run: |
          flutter create --platforms=android --project-name fitmatch_app "$RUNNER_TEMP/scaffold"
          cp -r "$RUNNER_TEMP/scaffold/android" ./android
          sed -i 's/android:label="[^"]*"/android:label="FitMatch"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Generar el ícono de la app
        continue-on-error: true
        run: dart run flutter_launcher_icons

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: fitmatch-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar el APK como Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FitMatch APK #${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
